# Nordic OT CTI Watch configuration. Copy to config.toml and adjust.

[filters]
# ISO 3166 alpha-2 codes. Victims in these countries are at least MEDIUM priority.
countries = ["NO", "SE", "DK", "FI", "IS"]

# Word-start matches against the victim sector ("activity") and description.
# Nordic + OT sector = HIGH priority.
ot_sectors = ["energy", "utilit", "power", "hydro", "grid", "heating", "manufactur", "industrial",
              "automation", "refrigerat", "agricultur", "food", "dairy", "transport", "logistic",
              "water", "oil", "gas", "chemical", "mining", "maritime", "shipping", "aquaculture"]

# Organisations you care about (your employer, customers, suppliers).
# Any match = CRITICAL. Keep the real list in a private config, not in a public repo.
watchlist = []

# Vendors to flag in CISA ICS advisories.
ics_vendors = ["Siemens", "Danfoss", "Copeland", "Dixell", "Schneider Electric", "ABB",
               "Hitachi Energy", "Rockwell", "Phoenix Contact", "Moxa", "Mitsubishi Electric",
               "Honeywell", "Emerson", "Johnson Controls", "Kongsberg", "Wago", "Beckhoff"]

# Lowest priority to report: LOW, MEDIUM, HIGH or CRITICAL.
min_priority = "MEDIUM"

# Ignore claims discovered more than this many days ago (0 = no limit).
max_age_days = 14

[sources]
enable_ransomware = true
# ICS vulnerability advisories (CVEs). Off: this watcher is about attacks, not patches.
enable_ics_advisories = false
ransomware_api = "https://api.ransomware.live/v2"
# "csaf": CISA advisories from github.com/cisagov/CSAF (works from GitHub Actions).
# "rss":  the cisa.gov RSS feed (often blocked with HTTP 403 from cloud servers).
ics_source = "csaf"
ics_limit = 15
cisa_ics_feed = "https://www.cisa.gov/cybersecurity-advisories/ics-advisories.xml"

[news]
# Attack signals. HIGH = Nordic + attack + (OT/critical infrastructure or known hacktivist group),
# or any Nordic target in a hacktivist channel. MEDIUM = OT attack elsewhere. CVE/patch news is dropped.
enable_news = true

# Public hacktivist Telegram channels, read via https://t.me/s/<name> (no login, no account).
# This is the earliest public signal: groups like NoName057(16) post target lists here when an
# attack starts, often hours before the news. Names change when channels are banned, so keep
# the list current, e.g. from deepdarkCTI's telegram_threat_actors.md. In GitHub Actions use the
# CTI_TELEGRAM_CHANNELS secret (comma separated) instead of editing this file.
telegram_channels = []

news_feeds = [
  { name = "The Record", url = "https://therecord.media/feed/" },
  { name = "BleepingComputer", url = "https://www.bleepingcomputer.com/feed/" },
  { name = "SecurityWeek ICS/OT", url = "https://www.securityweek.com/category/ics-ot/feed/" },
  { name = "Industrial Cyber", url = "https://industrialcyber.co/feed/" },
  { name = "The Hacker News", url = "https://feeds.feedburner.com/TheHackersNews" },
  { name = "CERT-SE", url = "https://www.cert.se/feed.rss", country = "SE" },
  { name = "NRK", url = "https://www.nrk.no/toppsaker.rss", country = "NO" },
  { name = "digi.no", url = "https://www.digi.no/rss", country = "NO" },
  { name = "SVT", url = "https://www.svt.se/nyheter/rss.xml", country = "SE" },
  { name = "DR", url = "https://www.dr.dk/nyheder/service/feeds/allenyheder", country = "DK" },
  { name = "Traficom NCSC-FI", url = "https://www.kyberturvallisuuskeskus.fi/feed/rss/fi", country = "FI" },
  { name = "SAMSIK (DK)", url = "https://samsik.dk/feed/", country = "DK" },
  { name = "MCF (SE)", url = "https://www.mcf.se/sv/rss-floden/rss-alla-nyheter-fran-myndigheten-for-civilt-forsvar/", country = "SE" },
  { name = "Yle", url = "https://feeds.yle.fi/uutiset/v1/recent.rss?publisherIds=YLE_UUTISET", country = "FI" },
]

# Background reading for ONE daily digest on Telegram (hacktivist alliances, OT attacks anywhere,
# trend reports). No Nordic requirement, never instant alerts.
context_feeds = [
  { name = "SecPost", url = "https://secpost.ru/feed" },
  { name = "Industrial Cyber", url = "https://industrialcyber.co/feed/" },
  { name = "The Record", url = "https://therecord.media/feed" },
  { name = "Dragos", url = "https://www.dragos.com/blog.rss" },
  { name = "SecurityWeek ICS", url = "https://www.securityweek.com/category/ics-ot/feed/" },
]
digest_hour_utc = 6    # first run at or after 06:00 UTC (07:00 Oslo in winter)
digest_max_items = 12

[network]
request_delay_seconds = 2.0
timeout_seconds = 30.0

[output]
state_file = "state/seen.json"
report_dir = "reports"
# Prefer the CTI_WEBHOOK_URL environment variable over putting the URL here.
webhook_url = ""
webhook_format = "slack"   # slack | teams | discord
